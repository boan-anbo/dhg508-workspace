<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="65%" stop-color="#182638"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Rain streaks -->
  <g stroke="#60a5fa" stroke-opacity="0.22" stroke-width="1.2">
    <line x1="90" y1="20" x2="65" y2="140"/><line x1="190" y1="40" x2="165" y2="160"/>
    <line x1="310" y1="10" x2="285" y2="130"/><line x1="440" y1="35" x2="415" y2="155"/>
    <line x1="580" y1="15" x2="555" y2="135"/><line x1="710" y1="45" x2="685" y2="165"/>
    <line x1="140" y1="190" x2="115" y2="310"/><line x1="510" y1="180" x2="485" y2="300"/>
    <line x1="660" y1="195" x2="635" y2="315"/>
  </g>
  <!-- Cargo containers silhouette -->
  <rect x="40" y="210" width="210" height="135" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="65" y="125" width="185" height="85" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="540" y="185" width="220" height="160" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Wet dock ground -->
  <polygon points="0,345 800,345 800,500 0,500" fill="#090f17"/>
  <line x1="0" y1="345" x2="800" y2="345" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
  <!-- Uplink relay beacon -->
  <line x1="395" y1="135" x2="395" y2="345" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="395" cy="130" r="10" fill="#ef4444"/>
  <circle cx="395" cy="130" r="24" fill="none" stroke="#ef4444" stroke-opacity="0.45" stroke-width="2"/>
  <!-- Gull drone & Hound silhouettes -->
  <g transform="translate(290,155)">
    <polygon points="0,12 22,0 44,12 22,18" fill="#0f172a" stroke="#f87171" stroke-width="1.8"/>
    <text x="22" y="-8" text-anchor="middle" fill="#fca5a5" font-family="JetBrains Mono, monospace" font-size="11">GULL DRONE</text>
  </g>
  <g transform="translate(455,295)">
    <rect x="0" y="0" width="52" height="22" fill="#0f172a" stroke="#fbbf24" stroke-width="1.8"/>
    <line x1="8" y1="22" x2="4" y2="45" stroke="#fbbf24" stroke-width="2"/>
    <line x1="44" y1="22" x2="48" y2="45" stroke="#fbbf24" stroke-width="2"/>
    <text x="26" y="-8" text-anchor="middle" fill="#fde68a" font-family="JetBrains Mono, monospace" font-size="11">HOUND UNIT</text>
  </g>
  <!-- Red-dot reticle -->
  <circle cx="395" cy="250" r="26" fill="none" stroke="#ef4444" stroke-opacity="0.7" stroke-width="1.5"/>
  <circle cx="395" cy="250" r="3.5" fill="#ef4444"/>
  <!-- HUD overlays -->
  <rect x="24" y="22" width="265" height="54" fill="#090d16" fill-opacity="0.86" stroke="#334155"/>
  <text x="38" y="44" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">SALTLINE · 05:42 CARGO PORT</text>
  <text x="38" y="64" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11">RELAYS: 1/3 CUT · THREE.JS + WEBGL</text>
  <rect x="515" y="420" width="260" height="56" fill="#090d16" fill-opacity="0.88" stroke="#ef4444"/>
  <text x="530" y="443" fill="#fca5a5" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">SINGLE-FILE HTML ARTIFACT</text>
  <text x="530" y="463" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="11">8h Fable 5.2 · 0 external assets</text>
</svg>
