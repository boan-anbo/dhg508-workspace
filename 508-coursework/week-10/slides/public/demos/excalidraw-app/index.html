<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="./">
  <title>Excalidraw Live Canvas · VMOCC Floor Plan</title>
  <style>
    body { margin: 0; padding: 0; font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; background: #fff; overflow: hidden; }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .header, .scene-load-status { display: none !important; }
    .canvas-container { flex: 1; min-height: 0; width: 100%; height: 100vh; position: relative; }
    #mcp-live-pill {
      position: fixed; right: 14px; bottom: 14px; z-index: 9999;
      background: #18181b; color: #f4f4f5; border: 1.5px solid #111;
      padding: 7px 12px; font: 600 12px/1.3 'JetBrains Mono', ui-monospace, monospace;
      display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }
    #mcp-live-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; display: inline-block; }
    #mcp-live-pill button {
      background: #27272a; color: #fbbf24; border: 1px solid #52525b;
      padding: 3px 8px; font: 600 11px/1.2 'JetBrains Mono', monospace; cursor: pointer;
    }
    #mcp-json-drawer {
      display: none; position: fixed; right: 14px; bottom: 52px; z-index: 9999;
      width: 420px; max-height: 260px; overflow: auto;
      background: #18181b; color: #e4e4e7; border: 1.5px solid #e31f27;
      padding: 10px 12px; font: 11.5px/1.45 'JetBrains Mono', ui-monospace, monospace;
      box-shadow: 0 8px 24px rgba(0,0,0,0.28); white-space: pre-wrap;
    }
  </style>
  <script>
    (function () {
      window.localStorage.setItem('excalidraw-canvas-theme', 'light');
      const params = new URLSearchParams(window.location.search);
      const sceneKey = params.get('scene') || 'round29';
      const sceneMap = {
        round29: '../vmocc-round29-rooms.excalidraw',
        round24: '../vmocc-round24-hillock.excalidraw',
        draft15: '../vmocc-draft15-landform.excalidraw'
      };

      let latestElements = [];
      function updateBadge(tag) {
        const txt = document.getElementById('mcp-live-text');
        const pre = document.getElementById('mcp-json-pre');
        if (txt) txt.textContent = `mcp-excalidraw · ${tag} (${latestElements.length} elements)`;
        if (pre) {
          const tail = latestElements.slice(-4).map(e => ({
            id: e.id, type: e.type,
            x: Math.round(e.x || 0), y: Math.round(e.y || 0),
            ...(e.width ? { w: Math.round(e.width), h: Math.round(e.height) } : {}),
            ...(e.text ? { text: e.text } : {})
          }));
          pre.textContent = '// Latest elements read back by agent via get_scene:\n' + JSON.stringify(tail, null, 2);
        }
      }

      // Mock same-host WebSocket so standalone mode stays "connected" cleanly with 0 console errors
      const OrigWS = window.WebSocket;
      window.WebSocket = function (url, protocols) {
        if (typeof url === 'string' && url.includes(window.location.host)) {
          const fake = {
            readyState: 1, OPEN: 1, CONNECTING: 0, CLOSING: 2, CLOSED: 3,
            send() {}, close() { this.readyState = 3; },
            addEventListener() {}, removeEventListener() {}
          };
          setTimeout(() => { if (typeof fake.onopen === 'function') fake.onopen({}); }, 30);
          return fake;
        }
        return new OrigWS(url, protocols);
      };
      window.WebSocket.OPEN = 1;
      window.WebSocket.CONNECTING = 0;

      const origFetch = window.fetch.bind(window);
      window.fetch = async function (input, init) {
        const url = typeof input === 'string' ? input : (input && input.url) || '';
        if (url.endsWith('/api/elements')) {
          if (sceneKey === 'blank' || !sceneMap[sceneKey]) {
            latestElements = [];
            setTimeout(() => updateBadge('ready'), 80);
            return new Response(JSON.stringify({ success: true, elements: [] }), { headers: { 'Content-Type': 'application/json' } });
          }
          const r = await origFetch(sceneMap[sceneKey]);
          const data = await r.json();
          const raw = Array.isArray(data.elements) ? data.elements : [];
          let minX = Infinity, minY = Infinity;
          for (const el of raw) {
            if (typeof el.x === 'number' && el.x < minX) minX = el.x;
            if (typeof el.y === 'number' && el.y < minY) minY = el.y;
          }
          const dx = isFinite(minX) ? (minX - 90) : 0;
          const dy = isFinite(minY) ? (minY - 80) : 0;
          latestElements = raw.map(el => ({ ...el, x: (el.x || 0) - dx, y: (el.y || 0) - dy }));
          setTimeout(() => updateBadge('loaded VMOCC'), 120);
          return new Response(JSON.stringify({ success: true, elements: latestElements }), { headers: { 'Content-Type': 'application/json' } });
        }
        if (url.endsWith('/api/files')) {
          return new Response(JSON.stringify({ success: true, files: {} }), { headers: { 'Content-Type': 'application/json' } });
        }
        if (url.includes('/api/elements/sync')) {
          try {
            const body = JSON.parse((init && init.body) || '{}');
            if (Array.isArray(body.elements)) {
              latestElements = body.elements.filter(e => !e.isDeleted);
              updateBadge('synced edit → agent');
            }
          } catch {}
          return new Response(JSON.stringify({ success: true, count: latestElements.length }), { headers: { 'Content-Type': 'application/json' } });
        }
        if (url.includes('/api/elements/clear')) {
          latestElements = [];
          updateBadge('cleared');
          return new Response(JSON.stringify({ success: true }), { headers: { 'Content-Type': 'application/json' } });
        }
        return origFetch(input, init);
      };
    })();
  </script>
  <script type="module" crossorigin src="./assets/index-CxSLUdi8.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BcAUh2Nm.css">
</head>
<body>
  <div id="root"></div>
  <div id="mcp-json-drawer"><div id="mcp-json-pre">// Draw or move any room on canvas...</div></div>
  <div id="mcp-live-pill">
    <span class="dot"></span>
    <span id="mcp-live-text">mcp-excalidraw · loading…</span>
    <button type="button" onclick="const d=document.getElementById('mcp-json-drawer');d.style.display=d.style.display==='block'?'none':'block'">get_scene JSON</button>
  </div>
</body>
</html>
